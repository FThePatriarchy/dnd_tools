- name: Divine Spark
  level: 2
  origin: class
  actions:
  - name: Divine Spark (Heal)
    cost: action
    resource: channel_divinity
    effects:
    - id: spark_heal
      event: on_cast
      target: &id001
        select: single
        filter:
        - creature
        - visible
        affects: any
        eligible_if: target != caster
        within_ft: 30
      attack: null
      save: null
      on_hit: []
      on_fail: []
      on_success: []
      apply:
      - heal:
          dice: spark_dice
          bonus: spell_mod
      limit: null
    magical: true
  - name: Divine Spark (Radiant)
    cost: action
    resource: channel_divinity
    effects:
    - id: spark_damage
      event: on_cast
      target: *id001
      attack: null
      save:
        ability: con
        on_success: half
      on_hit: []
      on_fail:
      - damage:
          dice: spark_dice
          bonus: spell_mod
          type: radiant
      on_success: []
      apply: []
      limit: null
    magical: true
  - name: Divine Spark (Necrotic)
    cost: action
    resource: channel_divinity
    effects:
    - id: spark_damage
      event: on_cast
      target:
        select: single
        filter:
        - creature
        - visible
        affects: any
        eligible_if: target != caster
        within_ft: 30
      attack: null
      save:
        ability: con
        on_success: half
      on_hit: []
      on_fail:
      - damage:
          dice: spark_dice
          bonus: spell_mod
          type: necrotic
      on_success: []
      apply: []
      limit: null
    magical: true
- name: Turn Undead
  level: 2
  origin: class
  actions:
  - name: Turn Undead
    cost: action
    resource: channel_divinity
    effects:
    - id: turn_undead
      event: on_cast
      target:
        select: n_targets
        n: all
        distinct: true
        up_to: true
        filter:
        - creature
        affects: enemy
        within_ft: 30
        eligible_if: target.creature_type == undead
      attack: null
      save:
        ability: wis
        on_success: negate
      on_hit: []
      on_fail:
      - apply_condition:
          condition: frightened
          ends_on_damage: any
          linked: true
      - apply_condition:
          condition: incapacitated
          ends_on_damage: any
          linked: true
      on_success: []
      apply: []
      limit: null
    magical: true
    duration:
      type: minutes
      n: 1
  unsupported: Fleeing movement is not simulated; chosen visible/in-range undead are
    assumed in reach under the shared no-grid convention.
