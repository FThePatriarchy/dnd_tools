unsupported:
- Unoccupied placement, ranges, languages, senses and movement need geometry/environment.
  Summoned creatures are real targetable combatants immediately after the caster.
  The printed parent stat blocks, not contradictory generated versions, determine
  statistics.
- Heated Body's grapple-start branch and Berserk Lashing's fallback movement need
  reach/grapple positions. On-damage Clay reaction attacks execute.
