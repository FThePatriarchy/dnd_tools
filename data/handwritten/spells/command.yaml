name: Command
source: XPHB
level: 1
school: enchantment
casting_time: action
reaction_trigger: null
range:
  type: point
  feet: 60
components:
  v: true
  s: false
  m: null
  m_consumed: false
  m_cost_gp: null
duration:
  type: instant
concentration: false
ritual: false
choices:
- id: command
  options:
  - halt
  - grovel
  when: on_cast
effects:
- id: main
  event: on_cast
  target:
    select: n_targets
    n: 1
    distinct: true
    up_to: true
    min: 1
    filter:
    - creature
    - visible
    affects: any
  attack: null
  save:
    ability: wis
    on_success: negate
  on_hit: []
  on_fail:
  - turn_rules:
      no_action: true
      no_bonus_action: true
    until: end_of_turn(target.next_turn)
  - turn_rules:
      on_turn_condition: prone
    if: $command == grovel
    until: end_of_turn(target.next_turn)
  on_success: []
  apply: []
  limit: null
scaling:
  upcast:
    per_slot_above: 1
    changes:
    - block: main
      target_n_add: 1
ends_on: []
unsupported:
- Approach/Flee movement, Halt movement prohibition and Drop equipment handling need a grid/inventory; only Halt/Grovel
  action denial is executable.
