unsupported:
- Caller supplies eligible loose nonmagical non-Gargantuan objects. A homogeneous selected size is supported with
  exact weighted count; mixed-size inventories require explicit object selections. The printed Animated Object Slam
  deals Force, not the obsolete Bludgeoning/Piercing/Slashing spell tags. Object-form overflow after reversion,
  legs/placement and 500-foot commands need object/geometry state.
