unsupported:
- Unoccupied placement, ranges, languages, senses and movement need geometry/environment.
  Summoned creatures are real targetable combatants immediately after the caster.
  The printed parent stat blocks, not contradictory generated versions, determine
  statistics.
- Mounted movement and Life Bond's five-foot proximity need explicit mounted/proximity
  state. When mounted, the controlled steed Dodges rather than attacks; independent
  protection acts after caster. Fey teleport requires positions.
