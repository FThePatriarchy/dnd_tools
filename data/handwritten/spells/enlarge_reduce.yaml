name: Enlarge/Reduce
source: XPHB
level: 2
school: transmutation
casting_time: action
reaction_trigger: null
range:
  type: point
  feet: 30
components:
  v: true
  s: true
  m: a pinch of powdered iron
  m_consumed: false
  m_cost_gp: null
duration:
  type: minutes
  n: 1
concentration: true
ritual: false
choices:
- id: size
  options:
  - enlarge
  - reduce
  when: on_cast
effects:
- id: main
  event: on_cast
  target:
    select: single
    filter:
    - creature
    affects: any
  attack: null
  save:
    ability: con
    on_success: negate
    if: not target.willing
  on_hit: []
  on_fail:
  - size_change:
      direction: increase
    if: $size == enlarge
  - advantage:
      'on': ability_checks
      scope: str
      against: null
    if: $size == enlarge
  - advantage:
      'on': saves
      scope: str
      against: null
    if: $size == enlarge
  - weapon_adjustment:
      dice: 1d4
      op: add
      minimum: 1
    if: $size == enlarge
  - size_change:
      direction: decrease
    if: $size == reduce
  - disadvantage:
      'on': ability_checks
      scope: str
      against: null
    if: $size == reduce
  - disadvantage:
      'on': saves
      scope: str
      against: null
    if: $size == reduce
  - weapon_adjustment:
      dice: 1d4
      op: sub
      minimum: 1
    if: $size == reduce
  on_success: []
  apply: []
  limit: null
scaling: null
ends_on: []
unsupported:
- Objects, equipment resizing, carrying capacity and occupied space need inventory/positions; size and weapon/Unarmed
  Strike extra or reduced 1d4 (minimum 1) execute.
