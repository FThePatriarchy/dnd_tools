name: Blindness/Deafness
source: XPHB
level: 2
school: transmutation
casting_time: action
reaction_trigger: null
range:
  type: point
  feet: 120
components:
  v: true
  s: false
  m: null
  m_consumed: false
  m_cost_gp: null
duration:
  type: minutes
  n: 1
concentration: false
ritual: false
choices:
- id: condition
  options:
  - blinded
  - deafened
  when: on_cast
effects:
- id: main
  event: on_cast
  target:
    select: n_targets
    n: 1
    distinct: true
    up_to: true
    min: 1
    filter:
    - creature
    - visible
    affects: any
  attack: null
  save:
    ability: con
    on_success: negate
  on_hit: []
  on_fail:
  - apply_condition:
      condition: blinded
      repeat_save:
        ability: con
        timing: end_of_turn
        on_success: end
    if: $condition == blinded
  - apply_condition:
      condition: deafened
      repeat_save:
        ability: con
        timing: end_of_turn
        on_success: end
    if: $condition == deafened
  on_success: []
  apply: []
  limit: null
scaling:
  upcast:
    per_slot_above: 2
    changes:
    - block: main
      target_n_add: 1
ends_on: []
unsupported: []
