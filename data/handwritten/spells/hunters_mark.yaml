name: Hunter's Mark
source: XPHB
level: 1
school: divination
casting_time: bonus_action
reaction_trigger: null
range:
  type: point
  feet: 90
components:
  v: true
  s: false
  m: null
  m_consumed: false
  m_cost_gp: null
duration:
  type: hours
  n: 1
concentration: true
ritual: false
choices: []
effects:
- id: mark
  event: on_cast or bonus_action_command
  target:
    select: single
    filter:
    - creature
    - visible
    - new_target
    affects: any
  attack: null
  save: null
  on_hit: []
  on_fail: []
  on_success: []
  apply:
