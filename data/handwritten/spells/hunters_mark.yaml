    select: ref
    ref: mark
  attack: null
  save: null
  on_hit: []
  on_fail: []
  on_success: []
  apply:
  - damage:
      dice: 1d6
      bonus: 0
      type: force
    if: defender == mark.target
  limit: null
scaling:
  upcast:
    per_slot_above: 1
    changes:
    - duration:
        type: hours
        n: 8
      slot_min: 3
      slot_max: 4
    - duration:
        type: hours
        n: 24
      slot_min: 5
      slot_max: null
ends_on: []
unsupported:
- Advantage on Wisdom (Perception or Survival) checks to find the marked creature; tracking is outside combat resolution.
